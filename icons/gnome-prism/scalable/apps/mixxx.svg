<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 128 128" fill="none" preserveAspectRatio="xMidYMid meet">
  <g stroke="var(--fill-0, #BDA7F0)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Turntable plinth -->
    <rect x="12" y="20" width="104" height="88" rx="12"/>
    <!-- Platter / record -->
    <circle cx="54" cy="64" r="32"/>
    <!-- Record grooves -->
    <path d="M54 44 A20 20 0 0 1 74 64" stroke-width="4"/>
    <path d="M54 84 A20 20 0 0 1 34 64" stroke-width="4"/>
    <!-- Label / spindle -->
    <circle cx="54" cy="64" r="6" fill="var(--fill-0, #BDA7F0)"/>
    <!-- Tonearm -->
    <circle cx="100" cy="34" r="4" fill="var(--fill-0, #BDA7F0)"/>
    <path d="M100 34 L100 70 L84 84"/>
    <!-- Pitch fader -->
    <line x1="100" y1="88" x2="100" y2="96" stroke-width="4"/>
